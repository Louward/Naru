<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#ffac00">
    <title>블라블라</title>
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/chat.css">
</head>
<body>
    <div class="container">
        <div class="header chat-header">
            <button class="back" onclick="goBack()" aria-label="뒤로가기">‹</button>
            <div class="title-area">
                <span id="chatname" class="title">대화방</span>
                <span id="membercount" class="member-count" hidden></span>
            </div>
            <div class="time"></div>
        </div>
        <div class="messages" id="messages">
            <!-- 메시지가 여기에 동적으로 추가됩니다 -->
        </div>
        <div class="typing-area" id="typingArea"></div>
        <div class="message-input">
            <input type="text" id="messageInput" class="input-field" placeholder="메시지를 입력하세요" autocomplete="off" autofocus>
            <button id="messageButton" class="send-button" aria-label="보내기">➤</button>
        </div>
    </div>
    <script src="/js/common.js"></script>
    <script src="/js/chat.js"></script>
</body>
</html>
